openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: routes
  - name: buses
  - name: stops
  - name: operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /routes:
    get:
      operationId: getRoutes
      tags: [routes]
      summary: List demo MTC routes
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Route"
  /route:
    get:
      operationId: getRoute
      tags: [routes]
      summary: Get a route with ordered physical stops
      parameters:
        - in: query
          name: routeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Route"
  /route/stops:
    get:
      operationId: getRouteStops
      tags: [routes]
      summary: List physical stops on a route
      parameters:
        - in: query
          name: routeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Route stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stop"
  /buses:
    get:
      operationId: getBuses
      tags: [buses]
      summary: List nearby demo buses
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: routeId
          schema: { type: string }
      responses:
        "200":
          description: Buses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusSummary"
  /bus:
    get:
      operationId: getBus
      tags: [buses]
      summary: Get live bus details and physical-stop forecast
      parameters:
        - in: query
          name: busId
          required: true
          schema: { type: string }
        - in: query
          name: targetStopId
          schema: { type: string }
      responses:
        "200":
          description: Bus details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusDetails"
  /stops:
    get:
      operationId: getStops
      tags: [stops]
      summary: List nearby or searched physical stops
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Stops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stop"
  /stop:
    get:
      operationId: getStop
      tags: [stops]
      summary: Get stop details and approaching buses
      parameters:
        - in: query
          name: stopId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stop details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopDetails"
  /operator/overview:
    get:
      operationId: getOperatorOverview
      tags: [operations]
      summary: Get fleet monitoring overview
      responses:
        "200":
          description: Fleet overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorOverview"
  /operator/bus:
    get:
      operationId: getOperatorBus
      tags: [operations]
      summary: Get operator analytics for a bus
      parameters:
        - in: query
          name: busId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Operator bus detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorBus"
  /operator/security-events:
    get:
      operationId: getSecurityEvents
      tags: [operations]
      summary: List event-level security alerts
      responses:
        "200":
          description: Security events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
    post:
      operationId: reviewSecurityEvent
      tags: [operations]
      summary: Review a security event as an authenticated operator
      security:
        - operatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventReview"
      responses:
        "200":
          description: Updated security event and audit entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventReviewResponse"
        "400":
          description: Invalid review request
        "401":
          description: Authenticated operator access is required
        "404":
          description: Security event not found
        "409":
          description: Event already has the requested status
  /operator/security-events/audit:
    get:
      operationId: getSecurityEventAudit
      tags: [operations]
      summary: List the authenticated operator audit trail
      security:
        - operatorBearer: []
      parameters:
        - in: query
          name: eventId
          schema: { type: string }
      responses:
        "200":
          description: Security event audit entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventAuditResponse"
        "401":
          description: Authenticated operator access is required
  /operator/security-investigation:
    get:
      operationId: getSecurityInvestigation
      tags: [operations]
      summary: List simulated security investigation events
      parameters:
        - in: query
          name: busNumber
          schema: { type: string }
        - in: query
          name: stop
          schema: { type: string }
        - in: query
          name: eventType
          schema: { type: string }
        - in: query
          name: minConfidence
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Security investigation events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
components:
  securitySchemes:
    operatorBearer:
      type: http
      scheme: bearer
      bearerFormat: operator-token
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Route:
      type: object
      required: [id, routeNumber, origin, destination, serviceType, stops]
      properties:
        id: { type: string }
        routeNumber: { type: string }
        origin: { type: string }
        destination: { type: string }
        serviceType: { type: string }
        liveTracking: { type: boolean }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Stop" }
    Stop:
      type: object
      required: [id, name, sequence, latitude, longitude]
      properties:
        id: { type: string }
        name: { type: string }
        sequence: { type: integer }
        latitude: { type: number }
        longitude: { type: number }
        routes:
          type: array
          items: { type: string }
    BusSummary:
      type: object
      required: [id, number, routeId, routeNumber, origin, destination, serviceType, currentLocation, etaMinutes, currentOccupancy, predictedOccupancy, capacity, crowding, status, lastUpdatedSeconds]
      properties:
        id: { type: string }
        number: { type: string }
        routeId: { type: string }
        routeNumber: { type: string }
        origin: { type: string }
        destination: { type: string }
        serviceType: { type: string }
        currentLocation: { type: string }
        etaMinutes: { type: integer }
        currentOccupancy: { type: integer }
        predictedOccupancy: { type: integer }
        capacity: { type: integer }
        crowding: { type: string, enum: [Low, Moderate, High, "Very high"] }
        status: { type: string, enum: [LIVE, DELAYED, UNAVAILABLE] }
        lastUpdatedSeconds: { type: integer }
    BusDetails:
      allOf:
        - $ref: "#/components/schemas/BusSummary"
        - type: object
          required: [targetStop, nextStops, gps, flow, forecastConfidence, forecastUpdatedAt]
          properties:
            targetStop: { $ref: "#/components/schemas/Stop" }
            nextStops:
              type: array
              items: { $ref: "#/components/schemas/StopArrival" }
            gps:
              $ref: "#/components/schemas/GpsPosition"
            flow:
              $ref: "#/components/schemas/PassengerFlow"
            forecastConfidence: { type: string, enum: [Good, Moderate, Limited] }
            forecastUpdatedAt: { type: string }
    StopArrival:
      type: object
      required: [stop, etaMinutes, predictedOccupancy]
      properties:
        stop: { $ref: "#/components/schemas/Stop" }
        etaMinutes: { type: integer }
        predictedOccupancy: { type: integer }
    GpsPosition:
      type: object
      required: [latitude, longitude, speed, heading, timestamp]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        speed: { type: number }
        heading: { type: number }
        timestamp: { type: string }
    PassengerFlow:
      type: object
      required: [entriesRecent, exitsRecent, timestamp, source]
      properties:
        entriesRecent: { type: integer }
        exitsRecent: { type: integer }
        timestamp: { type: string }
        source: { type: string }
    StopDetails:
      type: object
      required: [stop, routes, upcomingBuses]
      properties:
        stop: { $ref: "#/components/schemas/Stop" }
        routes:
          type: array
          items: { type: string }
        upcomingBuses:
          type: array
          items: { $ref: "#/components/schemas/BusSummary" }
    OperatorOverview:
      type: object
      required: [activeBuses, liveTrackedBuses, highOccupancyBuses, mediumOccupancyBuses, lowOccupancyBuses, forecastAlerts, securityAlerts, dataQualityIssues, updatedAt, fleet]
      properties:
        activeBuses: { type: integer }
        liveTrackedBuses: { type: integer }
        highOccupancyBuses: { type: integer }
        mediumOccupancyBuses: { type: integer }
        lowOccupancyBuses: { type: integer }
        forecastAlerts: { type: integer }
        securityAlerts: { type: integer }
        dataQualityIssues: { type: integer }
        updatedAt: { type: string }
        fleet:
          type: array
          items: { $ref: "#/components/schemas/BusSummary" }
    OperatorBus:
      allOf:
        - $ref: "#/components/schemas/BusDetails"
        - type: object
          required: [reconciledOccupancy, reconciliationStatus, etmTimeline, occupancyTimeline]
          properties:
            reconciledOccupancy: { type: integer }
            reconciliationStatus: { type: string }
            etmTimeline:
              type: array
              items: { $ref: "#/components/schemas/EtmEvent" }
            occupancyTimeline:
              type: array
              items: { $ref: "#/components/schemas/OccupancyPoint" }
    EtmEvent:
      type: object
      required: [time, timestamp, busNumber, quantity, boardingStop, currentStop, passengerCount, destinationStage, status]
      properties:
        time: { type: string }
        timestamp: { type: string }
        busNumber: { type: string }
        quantity: { type: integer }
        boardingStop: { type: string }
        currentStop: { type: string }
        passengerCount: { type: integer }
        destinationStage: { type: string }
        status: { type: string }
    OccupancyPoint:
      type: object
      required: [time, camera, reconciled]
      properties:
        time: { type: string }
        camera: { type: integer }
        reconciled: { type: ["integer", "null"] }
    SecurityEvent:
      type: object
      required: [id, busNumber, location, physicalStop, latitude, longitude, time, timestamp, eventType, confidence, status, statusDetail, source, personTrackId, objectId, objectType, interactionType, timeline, etmContext, reviewHistory]
      properties:
        id: { type: string }
        busNumber: { type: string }
        location: { type: string }
        physicalStop: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        time: { type: string }
        timestamp: { type: string }
        eventType: { type: string }
        confidence: { type: integer }
        status: { type: string, enum: [Under review, Acknowledged, Escalated, Dismissed] }
        statusDetail: { type: string }
        source: { type: string }
        personTrackId: { type: string }
        objectId: { type: string }
        objectType: { type: string }
        interactionType: { type: string }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEventStep"
        etmContext:
          $ref: "#/components/schemas/EtmContext"
        reviewHistory:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEventAudit"
    SecurityEventReview:
      type: object
      required: [eventId, action]
      properties:
        eventId: { type: string }
        action: { type: string, enum: [acknowledge, escalate, dismiss] }
        note: { type: string, maxLength: 500 }
    SecurityEventAudit:
      type: object
      required: [id, eventId, action, fromStatus, toStatus, operatorId, operatorRole, timestamp]
      properties:
        id: { type: string }
        eventId: { type: string }
        action: { type: string, enum: [acknowledge, escalate, dismiss] }
        fromStatus: { type: string, enum: [Under review, Acknowledged, Escalated, Dismissed] }
        toStatus: { type: string, enum: [Under review, Acknowledged, Escalated, Dismissed] }
        operatorId: { type: string }
        operatorRole: { type: string, enum: [operator] }
        note: { type: string }
        timestamp: { type: string }
    SecurityEventReviewResponse:
      type: object
      required: [event, auditEntry, cacheVersion]
      properties:
        event: { $ref: "#/components/schemas/SecurityEvent" }
        auditEntry: { $ref: "#/components/schemas/SecurityEventAudit" }
        cacheVersion: { type: integer }
    SecurityEventAuditResponse:
      type: object
      required: [eventId, entries, cacheVersion]
      properties:
        eventId: { type: ["string", "null"] }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SecurityEventAudit" }
        cacheVersion: { type: integer }
    SecurityEventStep:
      type: object
      required: [time, label, detail, state]
      properties:
        time: { type: string }
        label: { type: string }
        detail: { type: string }
        state: { type: string, enum: [complete, active, pending] }
    EtmContext:
      type: object
      required: [transactionId, timestamp, boardingStop, currentStop, passengerCount, destinationStop]
      properties:
        transactionId: { type: string }
        timestamp: { type: string }
        boardingStop: { type: string }
        currentStop: { type: string }
        passengerCount: { type: integer }
        destinationStop: { type: string }

